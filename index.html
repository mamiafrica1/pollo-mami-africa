<title>Pollo Mami Africa</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff8f0;
  color:#222;
}

header{
  background:#111;
  color:#fff;
  padding:22px 16px;
  text-align:center;
}

header h1{
  margin:0;
  color:#ffd21c;
  font-size:34px;

}

  color:#ffd21c;
  padding:12px 16px;
  border-radius:10px;

}

.menu{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));

}

.item{
  background:#fff;
  border:2px solid #e7b900;
  border-radius:12px;
  padding:14px;
  display:flex;
  justify-content:space-between;
  gap:12px;

}

.name{
  font-weight:bold;
}

.price{
  font-weight:bold;
  color:#d71920;
  white-space:nowrap;
}

.info{
  background:#111;
  color:#fff;
  border-radius:12px;
  padding:18px;
  margin-top:24px;
  text-align:center;
}

.info strong{
  color:#ffd21c;
}

.whatsapp{
  display:inline-block;
  background:#25d366;
  color:#fff;
  text-decoration:none;
  padding:12px 20px;
  border-radius:25px;
  font-weight:bold;
  margin-top:10px;
}

footer{
  text-align:center;
  padding:22px;
  font-weight:bold;
}
</style>
</head>
